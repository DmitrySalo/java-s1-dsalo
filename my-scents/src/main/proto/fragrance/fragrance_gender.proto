enum FragranceGender {
  FRAGRANCE_GENDER_UNSPECIFIED = 0;
  FRAGRANCE_GENDER_MALE = 1;
  FRAGRANCE_GENDER_FEMALE = 2;
  FRAGRANCE_GENDER_UNISEX = 3;
}