syntax = "proto3";

package ru.my.scents.grpc.fragrance;

option java_multiple_files = true;
option java_package = "ru.my.scents.fragrance.adapter.controller.grpc.fragrance.proto";

import "google/protobuf/timestamp.proto";
import "fragrance/get_fragrance_request.proto";
import "fragrance/get_fragrance_response.proto";

service FragranceService {
  rpc GetFragrance (GetFragranceRequest) returns (GetFragranceResponse);
}