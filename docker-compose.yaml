version: "3.8"

services:
  mongodb:
    image: mongo:8-noble
    container_name: myscentsdb-2
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: myscentsdb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin -u admin -p password --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  fragrance-gripmock:
    image: bavix/gripmock:${GRIPMOCK_VERSION:-latest}
    container_name: fragrance-gripmock
    restart: unless-stopped
    ports:
      - "${FRAGRANCE_GRPC_PORT:-50051}:4770"
      - "${FRAGRANCE_ADMIN_PORT:-4771}:4771"
    volumes:
      - ${FRAGRANCE_PROTO_PATH:-./my-scents/src/main/proto}:/proto:ro
      - ${FRAGRANCE_STUBS_PATH:-./my-scents/gripmock/fragrance/stubs}:/stubs:ro
    command:
      - "--stub=/stubs"
      - "--imports=/proto"
      - "/proto/fragrance/alert_response.proto"
      - "/proto/fragrance/fragrance_availability_status.proto"
      - "/proto/fragrance/fragrance_data.proto"
      - "/proto/fragrance/fragrance_gender.proto"
      - "/proto/fragrance/fragrance_longevity.proto"
      - "/proto/fragrance/fragrance_season.proto"
      - "/proto/fragrance/fragrance_service.proto"
      - "/proto/fragrance/fragrance_sillage.proto"
      - "/proto/fragrance/fragrance_type.proto"
      - "/proto/fragrance/get_fragrance_request.proto"
      - "/proto/fragrance/get_fragrance_response.proto"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4771/api/stubs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  my-scents-app:
    build:
      context: ./
      dockerfile: my-scents/Dockerfile
    container_name: myscents-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      fragrance-gripmock:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8082:8081"
      - "50053:50053"
      - "9010:9010"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:password@mongodb:27017/myscentsdb?authSource=admin
      GRPC_FRAGRANCE_SERVICE_HOST: fragrance-gripmock
      GRPC_FRAGRANCE_SERVICE_PORT: 4770
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/manage/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  langchain-agent:
    build:
      context: ./langchain-agent
    profiles: ["agent"]
    restart: "no"
    depends_on:
      my-scents-app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      MY_SCENTS_BASE_URL: http://my-scents-app:8087
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: L0ZEQh1yTbGhNNUE7-6wSQ

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

#      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
#      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
#      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
#      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
#
#      KAFKA_LOG_RETENTION_HOURS: 168
#      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_DEBUG: "false"
    volumes:
      - schema_registry_data:/var/lib/schema-registry/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  schema-registry-init:
    image: alpine:3.19
    container_name: schema-registry-init
    depends_on:
      schema-registry:
        condition: service_healthy
    volumes:
      - ./my-scents/src/main/proto/fragrance:/schemas:ro
      - ./scripts/schema-registry:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl jq bash
        bash /scripts/register-schemas.sh
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PROTO_DIR: /schemas

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8080/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
  mongodb_config:
  kafka_data:
  schema_registry_data:
