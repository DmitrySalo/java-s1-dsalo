plugins {
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'ru.my.scents'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '25'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    annotationProcessor 'org.hibernate.orm:hibernate-jpamodelgen'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-web-services'
    implementation "org.springframework.boot:spring-boot-starter-jetty"
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'ch.qos.logback:logback-classic'

    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    implementation 'com.blazebit:blaze-persistence-core-api:1.6.17'
    runtimeOnly 'com.blazebit:blaze-persistence-core-impl:1.6.17'
    implementation 'com.blazebit:blaze-persistence-integration-hibernate-6.2:1.6.17'
    implementation 'com.blazebit:blaze-persistence-jpa-criteria-api:1.6.17'
    implementation 'com.blazebit:blaze-persistence-jpa-criteria-impl:1.6.17'

    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

configurations.configureEach {
    exclude module: 'slf4j-log4j12'
    exclude group: "org.springframework.boot", module: "spring-boot-starter-tomcat"
    exclude group: "org.apache.tomcat.embed", module: "tomcat-embed-el"
}

test {
    useJUnitPlatform()
}